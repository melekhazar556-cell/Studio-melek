<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0d0f14;
    color: #f4f6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 110px 72px;
    overflow: hidden;
  }
  .header {
    border-left: 8px solid #38bdf8;
    padding-left: 28px;
  }
  .tag {
    font-size: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 66px;
    line-height: 1.12;
    font-weight: 800;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 1120px;
    background: #151922;
    border: 2px solid #252c3b;
    border-radius: 36px;
    padding: 48px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 620px;
    border-bottom: 4px solid #334155;
    padding-bottom: 16px;
    margin-top: auto;
  }
  .bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 150px;
  }
  .bar-val {
    font-size: 32px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  .bar {
    width: 110px;
    height: 0;
    border-radius: 18px 18px 4px 4px;
    background: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
    animation: growBar 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .bar.accent {
    background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
  }
  .bar-label {
    font-size: 28px;
    color: #94a3b8;
    margin-top: 18px;
    font-weight: 600;
  }
  .b1 { animation-delay: 0.3s; --h: 160px; }
  .b2 { animation-delay: 0.8s; --h: 310px; }
  .b3 { animation-delay: 1.3s; --h: 460px; }
  .b4 { animation-delay: 1.8s; --h: 590px; }
  .v1 { animation-delay: 0.6s; }
  .v2 { animation-delay: 1.1s; }
  .v3 { animation-delay: 1.6s; }
  .v4 { animation-delay: 2.1s; }
  @keyframes growBar {
    from { height: 0; }
    to { height: var(--h); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #stickman {
    position: absolute;
    top: 70px;
    left: 60px;
    width: 220px;
    height: 280px;
    animation: walkAcross 8.5s linear forwards;
  }
  @keyframes walkAcross {
    0%   { transform: translateX(0px); }
    100% { transform: translateX(680px); }
  }
  .leg-l, .leg-r, .arm-l, .arm-r {
    transform-box: fill-box;
    transform-origin: top center;
  }
  .leg-l { animation: swingLegL 0.45s ease-in-out infinite alternate; }
  .leg-r { animation: swingLegR 0.45s ease-in-out infinite alternate; }
  .arm-l { animation: swingArmR 0.45s ease-in-out infinite alternate; }
  .arm-r { animation: swingArmL 0.45s ease-in-out infinite alternate; }
  @keyframes swingLegL { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  @keyframes swingLegR { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
  @keyframes swingArmL { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  @keyframes swingArmR { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
  .footer {
    font-size: 32px;
    color: #94a3b8;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="tag">Studio Melek • 60FPS Analiz</div>
    <h1>Tutarlılık Bileşik Etki Yaratır</h1>
  </div>

  <div class="stage">
    <svg id="stickman" viewBox="0 0 200 260" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="42" r="24" fill="#0d0f14"/>
      <line x1="100" y1="66" x2="100" y2="150"/>
      <line class="arm-l" x1="100" y1="84" x2="62" y2="132"/>
      <line class="arm-r" x1="100" y1="84" x2="138" y2="132"/>
      <line class="leg-l" x1="100" y1="150" x2="72" y2="225"/>
      <line class="leg-r" x1="100" y1="150" x2="128" y2="225"/>
    </svg>

    <div class="bars">
      <div class="bar-wrap">
        <div class="bar-val v1">1x</div>
        <div class="bar b1"></div>
        <div class="bar-label">1. Ay</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-val v2">3x</div>
        <div class="bar b2"></div>
        <div class="bar-label">3. Ay</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-val v3">7x</div>
        <div class="bar b3"></div>
        <div class="bar-label">6. Ay</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-val v4 accent" style="color:#4ade80;">15x</div>
        <div class="bar b4 accent"></div>
        <div class="bar-label">1. Yıl</div>
      </div>
    </div>
  </div>

  <div class="footer">Her gün tek sahne • 1080×1920 Dikey Format</div>
</body>
</html>
