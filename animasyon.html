<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #14100d;
    color: #fff8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 100px 64px;
    overflow: hidden;
  }
  .top-pill {
    display: inline-block;
    background: #f59e0b;
    color: #14100d;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 12px 26px;
    border-radius: 999px;
    margin-bottom: 22px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 66px;
    line-height: 1.12;
    font-weight: 900;
  }
  h1 em {
    font-style: normal;
    color: #fbbf24;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 1150px;
    background: radial-gradient(circle at 75% 25%, #2c2119 0%, #19130f 75%);
    border: 3px solid #3f3024;
    border-radius: 42px;
    padding: 46px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .info-bubble {
    background: rgba(251, 191, 36, 0.13);
    border: 2px solid #fbbf24;
    border-radius: 28px;
    padding: 28px 34px;
    font-size: 35px;
    line-height: 1.35;
    font-weight: 700;
    color: #fde68a;
    opacity: 0;
    animation: bubbleIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(22px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .floor {
    position: relative;
    width: 100%;
    height: 14px;
    background: #5c4636;
    border-radius: 999px;
  }
  .tulumba {
    position: absolute;
    right: 54px;
    bottom: 14px;
    width: 250px;
    opacity: 0;
    animation: tulumbaAppear 0.6s ease 0.9s forwards;
  }
  @keyframes tulumbaAppear {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .su-fiskiyesi {
    position: absolute;
    right: 195px;
    bottom: 185px;
    width: 350px;
    height: 230px;
    border-top: 14px dashed #38bdf8;
    border-right: 14px dashed #38bdf8;
    border-radius: 0 230px 0 0;
    opacity: 0;
    transform-origin: bottom right;
    animation: suAt 1.1s ease-out 3.3s forwards;
  }
  @keyframes suAt {
    0% { opacity: 0; transform: scale(0.5); }
    45% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.9; transform: scale(1.03); }
  }
  #heavy-stickman {
    position: absolute;
    left: 42px;
    bottom: 14px;
    width: 270px;
    height: 350px;
    animation: marchIn 2.2s cubic-bezier(0.25, 0.8, 0.25, 1) 0.2s forwards;
  }
  @keyframes marchIn {
    0% { transform: translateX(0px); }
    100% { transform: translateX(385px); }
  }
  .limb-l, .limb-r, .arm-l, .arm-r {
    transform-box: fill-box;
    transform-origin: top center;
  }
  .limb-l { animation: stepL 0.34s ease-in-out infinite alternate; }
  .limb-r { animation: stepR 0.34s ease-in-out infinite alternate; }
  .arm-l  { animation: swingR 0.34s ease-in-out infinite alternate; }
  .arm-r  { animation: swingL 0.34s ease-in-out infinite alternate; }
  @keyframes stepL  { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
  @keyframes stepR  { from { transform: rotate(30deg); }  to { transform: rotate(-30deg); } }
  @keyframes swingL { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
  @keyframes swingR { from { transform: rotate(26deg); }  to { transform: rotate(-26deg); } }
  .bottom-card {
    background: #fbbf24;
    color: #14100d;
    border-radius: 30px;
    padding: 34px 36px;
    font-size: 37px;
    line-height: 1.3;
    font-weight: 900;
    text-align: center;
  }
</style>
</head>
<body>
  <div>
    <div class="top-pill">Osmanlı Tarihi • Çocuklar İçin</div>
    <h1>Yangına <em>Tulumla</em> mı Gidilirdi?</h1>
  </div>

  <div class="stage">
    <div class="info-bubble">
      Eski İstanbul'da yangına koşan yiğitlere <strong>Tulumbacı</strong> denirdi!
    </div>

    <div style="position:relative; height: 450px; width: 100%;">
      <div class="su-fiskiyesi"></div>

      <!-- Gövdeli / Kalın Hatlı Osmanlı Tulumbacı Stickman -->
      <svg id="heavy-stickman" viewBox="0 0 240 320" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Kalın Bacaklar -->
        <g class="limb-l">
          <line x1="115" y1="195" x2="80" y2="290" stroke="#fff8eb" stroke-width="22"/>
          <rect x="64" y="282" width="34" height="16" rx="8" fill="#fbbf24"/>
        </g>
        <g class="limb-r">
          <line x1="125" y1="195" x2="160" y2="290" stroke="#fff8eb" stroke-width="22"/>
          <rect x="144" y="282" width="34" height="16" rx="8" fill="#fbbf24"/>
        </g>

        <!-- Kalın Gövde (Yelek / Gövde Kütlesi) -->
        <rect x="92" y="102" width="56" height="102" rx="24" fill="#fff8eb"/>
        <rect x="96" y="168" width="48" height="22" rx="8" fill="#b91c1c"/>

        <!-- Kalın Kollar -->
        <g class="arm-l">
          <line x1="96" y1="120" x2="52" y2="178" stroke="#fff8eb" stroke-width="18"/>
        </g>
        <g class="arm-r">
          <line x1="144" y1="120" x2="188" y2="178" stroke="#fff8eb" stroke-width="18"/>
        </g>

        <!-- Kafa ve Tulumbacı Kasketi -->
        <circle cx="120" cy="68" r="28" fill="#fff8eb" stroke="#19130f" stroke-width="4"/>
        <circle cx="130" cy="65" r="4" fill="#19130f"/>
        <path d="M84 54 C84 20, 156 20, 156 54 Z" fill="#dc2626"/>
        <rect x="144" y="46" width="28" height="9" rx="4" fill="#dc2626"/>
      </svg>

      <!-- El Tulumbası Pompası -->
      <svg class="tulumba" viewBox="0 0 250 185" fill="none">
        <rect x="30" y="64" width="185" height="78" rx="16" fill="#b45309" stroke="#fbbf24" stroke-width="7"/>
        <rect x="92" y="28" width="62" height="38" rx="10" fill="#d97706" stroke="#fbbf24" stroke-width="6"/>
        <circle cx="74" cy="152" r="27" fill="#292524" stroke="#fbbf24" stroke-width="7"/>
        <circle cx="178" cy="152" r="27" fill="#292524" stroke="#fbbf24" stroke-width="7"/>
      </svg>

      <div class="floor" style="position:absolute; bottom:0;"></div>
    </div>
  </div>

  <div class="bottom-card">
    Hayır! Adları kıyafetten değil, su basan "tulumba"dan gelir!
  </div>
</body>
</html>
