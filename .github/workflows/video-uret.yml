name: Stickman 60FPS Video Uretici

on:
  push:
    paths:
      - 'animasyon.html'
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Video Motorunu Hazirla
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install playwright
          npx playwright install chromium
      - name: 1080p 60FPS Video Kaydet
        run: |
          node -e '
          const { chromium } = require("playwright");
          const { execSync } = require("child_process");
          const path = require("path");
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 1080, height: 1920 },
              recordVideo: { dir: "./raw/", size: { width: 1080, height: 1920 } }
            });
            const page = await context.newPage();
            await page.goto("file://" + path.resolve("animasyon.html"));
            await page.waitForTimeout(10000);
            await context.close();
            await browser.close();
            execSync("ffmpeg -y -i raw/*.webm -r 60 -c:v libx264 -pix_fmt yuv420p -crf 16 stickman_60fps.mp4");
          })();
          '
      - name: Videoyu Indirmeye Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Stickman-1080p-60FPS-Video
          path: stickman_60fps.mp4
